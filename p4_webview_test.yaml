substitutions:
  device_name: p4-webview-test

esphome:
  name: ${device_name}
  friendly_name: P4 WebView Test

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  use_psram: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

external_components:
  - source:
      type: local
      path: components
    components: [p4_webview]
    refresh: 0s

  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]

  - source: github://jtenniswood/esphome-media-player@main
    components: [gsl3680]
    refresh: 0s

globals:
  - id: touch_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_active
    type: bool
    restore_value: no
    initial_value: 'false'

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: |-
          id(touch_x) = 1279 - touch.y;
          id(touch_y) = touch.x;
          id(touch_active) = true;
      - light.turn_on: backlight
    on_release:
      - lambda: |-
          id(touch_active) = false

display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: 50ms
    auto_clear_enabled: true
    rotation: 90
    lambda: |-
      const auto bg = Color(8, 12, 18);
      const auto panel = Color(25, 35, 48);
      const auto accent = Color(0, 180, 255);
      const auto touch = Color(255, 80, 80);
      const auto white = Color(245, 245, 245);

      it.fill(bg);
      it.filled_rectangle(20, 20, it.get_width() - 40, 90, panel);
      it.filled_rectangle(20, 130, it.get_width() - 40, 260, panel);
      it.filled_rectangle(40, 160, it.get_width() - 80, 80, accent);

      if (id(touch_active)) {
        const int x = std::max(0, std::min((int) it.get_width() - 1, id(touch_x)));
        const int y = std::max(0, std::min((int) it.get_height() - 1, id(touch_y)));
        it.filled_circle(x, y, 24, touch);
        it.filled_circle(x, y, 8, white);
      }

p4_webview:
  id: web_test
  host: "homeassistant"
  port: 8123
  width: 800
  height: 1280
  rotate: 90
  touch_rotate: 90
  url: "http://homeassistant:8123/lovelace/7"
  token: !secret ha_long_lived_token
  kiosk: true
  stats: true
  display_id: main_screen
  touchscreen_id: my_touch
