substitutions:
  device_name: p4-webview-test

esphome:
  name: ${device_name}
  friendly_name: P4 WebView Test

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

external_components:
  - source:
      type: local
      path: components
    components: [p4_webview]
    refresh: 0s

# Replace this section with your existing known-good display/touch configuration
# when you move this test into the new repository.
#
# display:
#   - platform: mipi_dsi
#     id: main_display
#     model: YOUR_MODEL
#     rotation: 0
#     update_interval: never
#
# touchscreen:
#   ...

p4_webview:
  id: web_test
  url: "http://example.com/"
  kiosk: true
  # display_id: main_display
  # touchscreen_id: my_touch
