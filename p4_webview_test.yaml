substitutions:
  device_name: p4-webview-test

esphome:
  name: ${device_name}
  friendly_name: P4 WebView Test

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal:
  
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17 
  use_psram: true

esp_ldo:
  - channel: 3
    voltage: 2.5V
    
psram:
  mode: hex
  speed: 200MHz

external_components:
  - source:
      type: local
      path: components
    components: [p4_webview]
    refresh: 0s

  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]


  - source: github://jtenniswood/esphome-media-player@main
    components: [ gsl3680 ]
    refresh: 0s

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz
    
output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight

    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false

    
p4_webview:
  id: web_test
  url: "http://example.com/"
  kiosk: true
  # display_id: main_display
  # touchscreen_id: my_touch
