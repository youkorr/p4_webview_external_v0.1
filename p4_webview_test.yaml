substitutions:
  device_name: p4-webview-test
  webview_server: "homeassistant:8081"
  dashboard_url: "http://homeassistant:8123/lovelace/7"

esphome:
  name: ${device_name}
  friendly_name: P4 WebView Test

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  use_psram: true
  sdio_frequency: 40000000

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false

# Real working ESPHome client: Chromium runs on the WebView server,
# while the P4 decodes JPEG tiles locally, writes them to MIPI-DSI,
# and forwards touchscreen events back to the browser.
external_components:
  - source: github://strange-v/RemoteWebViewClient@main
    refresh: 0s
    components: [remote_webview]

  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]

  - source: github://jtenniswood/esphome-media-player@main
    components: [gsl3680]
    refresh: 0s

remote_webview:
  id: web_test
  server: ${webview_server}
  url: ${dashboard_url}
  display_id: main_screen
  touchscreen_id: my_touch
  tile_size: 32
  full_frame_tile_count: 1
  full_frame_area_threshold: 0.50
  full_frame_every: 50
  every_nth_frame: 1
  min_frame_interval: 80
  jpeg_quality: 85
  max_bytes_per_msg: 61440
  big_endian: false
  rotation: 90
  on_frame_update:
    - logger.log: "Home Assistant dashboard frame displayed on P4"
